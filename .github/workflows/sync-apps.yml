name: Sync App Store apps

on:
  schedule:
    - cron: "17 4 * * *" # every day, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "Documents/**"
      - ".github/workflows/sync-apps.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-apps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch App Store catalog and render index.html
        run: node scripts/build.mjs --sync

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json index.html sitemap.xml
          git commit -m "chore: sync apps from App Store"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
